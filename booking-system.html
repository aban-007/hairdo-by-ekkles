<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Hair Do by Ekkles</title>

<style>
:root{
    --gold:#c5a059;
    --dark:#111111;
    --light:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:var(--dark);
    color:var(--light);
    font-family:Arial, sans-serif;
}

.container{
    width:95%;
    max-width:700px;
    margin:auto;
    padding:20px;
}

.logo{
    text-align:center;
    margin-top:20px;
}

.logo img{
    width:120px;
}

h1{
    text-align:center;
    color:var(--gold);
    letter-spacing:2px;
}

.subtitle{
    text-align:center;
    margin-bottom:30px;
    color:#ddd;
}

.form-box{
    border:1px solid var(--gold);
    border-radius:20px;
    padding:25px;
    background:#1a1a1a;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    color:var(--gold);
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

textarea{
    min-height:100px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:var(--gold);
    border:none;
    color:white;
    font-size:18px;
    border-radius:15px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.success{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#1f4723;
    color:#9cff9c;
    text-align:center;
}

.wa-button{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.wa-button img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.footer{
    text-align:center;
    padding:30px;
    color:#888;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <h1>BOOKING HAIR DO</h1>

    <div class="subtitle">
        by Ekkles Professional Hairstylist
    </div>

    <div class="form-box">

        <form id="bookingForm">

            <label>Nama Client</label>
            <input type="text" id="nama" required>

            <label>Nomor WhatsApp</label>
            <input type="text" id="wa" required>

            <label>Tanggal Booking</label>
            <input type="date" id="tanggal" required>

            <label>Jam Booking</label>
            <input type="time" id="jam" required>

            <label>Alamat Lokasi</label>
            <textarea id="lokasi" required></textarea>

            <label>Jenis Acara</label>
            <select id="acara">
                <option>Wedding</option>
                <option>Engagement</option>
                <option>Wisuda</option>
                <option>Party</option>
                <option>Prewedding</option>
                <option>Lainnya</option>
            </select>

            <label>Status DP</label>
            <select id="dp">
                <option>Belum DP</option>
                <option>Sudah DP</option>
            </select>

            <label>Catatan Tambahan</label>
            <textarea id="catatan"></textarea>

            <button type="submit">KIRIM BOOKING</button>

        </form>

        <div class="success" id="successMessage">
            Booking berhasil dikirim ✨
        </div>

    </div>

</div>

<a href="https://wa.me/6281314798161" class="wa-button" target="_blank">
    <img src="walogo.png" alt="WhatsApp">
</a>

<div class="footer">
    © 2026 Hair Do by Ekkles
</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbwugLvzB92tYEyP5O9UBzjXGDh7ZnmgvK_9zvYnkmTNko5yurCXagXbOmnj5padnHIU/exec";

const form = document.getElementById('bookingForm');

form.addEventListener('submit', async (e) => {

    e.preventDefault();

    const data = {
        nama: document.getElementById('nama').value,
        wa: document.getElementById('wa').value,
        tanggal: document.getElementById('tanggal').value,
        jam: document.getElementById('jam').value,
        lokasi: document.getElementById('lokasi').value,
        acara: document.getElementById('acara').value,
        dp: document.getElementById('dp').value,
        status: 'Pending',
        catatan: document.getElementById('catatan').value
    };

    try {

        const response = await fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if(result.result === 'success'){
            document.getElementById('successMessage').style.display = 'block';
            form.reset();
        }

    } catch(error){
        alert('Terjadi kesalahan.');
        console.log(error);
    }

});

</script>

</body>
</html>
